    // Après UNE session parfaite, les mots sont en boîte 2 : une boîte 3
    // demande deux réussites à des dates différentes. Un indicateur fondé sur
    // la seule boîte 3+ resterait figé à zéro, ce qui n'informe de rien.
    const cat50 = new Map();
    for (let i = 1; i <= 50; i += 1) cat50.set(`m${i}`, { id: `m${i}`, en: `m${i}`, palier: 1 });

    const uneSession = S.etatInitial();
    for (let i = 1; i <= 5; i += 1) {
      uneSession.words[`m${i}`] = { b: 2, r: "2026-09-05", s: 1, e: 0, d: null, st: "actif" };
    }
    const avancement1Session = B.avancementPalier(uneSession, cat50, 1);
    eq("5 mots rencontrés après une session", avancement1Session.vus, 5);
    eq("aucun en boîte 3+ — c'est normal", avancement1Session.acquis, 0);
    vrai("mais la barre a bougé", avancement1Session.partVus > 0);
    eq("le seuil de déblocage vaut 80 % de 50", avancement1Session.seuil, 40);

    const deuxJours = S.etatInitial();
    for (let i = 1; i <= 5; i += 1) {
      deuxJours.words[`m${i}`] = { b: 3, r: "x", s: 2, e: 0, d: null, st: "actif" };
    }
    for (let i = 6; i <= 10; i += 1) {
      deuxJours.words[`m${i}`] = { b: 2, r: "x", s: 1, e: 0, d: null, st: "actif" };
    }
    const avancement2Jours = B.avancementPalier(deuxJours, cat50, 1);
    eq("au 2e jour : 10 vus", avancement2Jours.vus, 10);
    eq("dont 5 en boîte 3+", avancement2Jours.acquis, 5);
    faux("le palier n'est pas encore acquis", avancement2Jours.atteint);

    section("paliers — choix explicite par l'utilisateur");

    const choisi = B.choisirPalier(S.etatInitial(), 2);
    eq("choisir le palier 2", choisi.progression.palier_actuel, 2);
    eq("revenir au palier 1 est permis",
       B.choisirPalier(choisi, 1).progression.palier_actuel, 1);
    eq("revenir en arrière ne dévalide rien",
       B.choisirPalier(debloque, 1).progression.paliers_valides, [1]);
    eq("choisir le palier déjà courant ne change rien",
       B.choisirPalier(choisi, 2), choisi);
    eq("un identifiant invalide est ignoré",
       B.choisirPalier(choisi, 0).progression.palier_actuel, 2);

    /* ====================================================== clavier ======= */
    section("clavier — disposition AZERTY (§17.6)");

    const clavier = K.Keyboard({ onKey: () => {}, onBackspace: () => {} });
    const rangees = [...clavier.querySelectorAll(".keyboard__row")]
      .map((r) => [...r.querySelectorAll(".btn")].map((b) => b.textContent).join(""));

    eq("la disposition par défaut est AZERTY", K.DISPOSITION_DEFAUT, "azerty");
    eq("rangée 1", rangees[0], "AZERTYUIOP");
    eq("rangée 2", rangees[1], "QSDFGHJKLM");
    eq("rangée 3", rangees[2], "WXCVBN");
    eq("26 touches en tout", rangees.join("").length, 26);
    eq("les 26 lettres, sans doublon", new Set(rangees.join("")).size, 26);
    eq("un seul retour arrière", clavier.querySelectorAll(".icon-btn").length, 1);
    faux("aucune touche espace", rangees.join("").includes(" "));

    const qwerty = K.Keyboard({ layout: "qwerty", onKey: () => {} });
    eq("QWERTY reste disponible",
       [...qwerty.querySelectorAll(".keyboard__row")][0].textContent, "QWERTYUIOP");

    const inconnu = K.Keyboard({ layout: "dvorak", onKey: () => {} });
    eq("une disposition inconnue retombe sur AZERTY",
       [...inconnu.querySelectorAll(".keyboard__row")][0].textContent, "AZERTYUIOP");

    const grisees = K.Keyboard({ disabledKeys: ["A", "z"], onKey: () => {} });
    eq("disabledKeys grise les touches, casse indifférente",
       [...grisees.querySelectorAll(".btn")].filter((b) => b.disabled)
         .map((b) => b.textContent).sort(), ["A", "Z"]);

    /* ============================================== défi quotidien ======= */
    /* ============================ les six sections (§02, §03, §06) ======== */
    section("discoveryBuilder — le tri de la découverte (§02)");

    const catDec = new Map([
      ["m1", { id: "m1", en: "boy",  fr: "garçon", palier: 1, rang_freq: 1 }],
      ["m2", { id: "m2", en: "car",  fr: "voiture", palier: 1, rang_freq: 2 }],
      ["m3", { id: "m3", en: "cat",  fr: "chat", palier: 1, rang_freq: 3 }],
    ]);

    const fileDec = DEC.composerDecouverte({ state: S.etatInitial(), catalogue: catDec });
    eq("la file de découverte reprend les mots du palier courant", fileDec.mots.length, 3);
    eq("un état neuf n'a rien de trié", fileDec.vide, false);

    const triConnu = DEC.appliquerDecouverte(S.etatInitial(), "m1", true, "2026-09-08");
    eq("« je connais » envoie le mot au quizz", triConnu.words.m1.st, "quizz");
    eq("il n'entre PAS encore dans le vivier des jeux", L.motsConnus(triConnu), []);
    eq("il est à vérifier dès aujourd'hui",
       L.motsAQuizzer(triConnu, "2026-09-08").map((e) => e.id), ["m1"]);

    const triInconnu = DEC.appliquerDecouverte(S.etatInitial(), "m2", false, "2026-09-08");
    eq("« je ne connais pas » place le mot en attente", triInconnu.words.m2.st, "attente");
    eq("il est revu dans exactement deux jours (§5)", triInconnu.words.m2.r, "2026-09-10");
    eq("il n'entre PAS dans le vivier des jeux", L.motsConnus(triInconnu), []);

    eq("un mot trié quitte la file de découverte",
       DEC.composerDecouverte({ state: triConnu, catalogue: catDec }).mots.map((m) => m.id),
       ["m2", "m3"]);

    section("quizBuilder — la porte unique vers les jeux (§03)");

    const catQuizz = new Map([
      ["q1", { id: "q1", en: "water", fr: "eau", palier: 1,
               indice: { en: "You drink it", segments: [
                 { txt: "You", trad: null }, { txt: "drink", trad: "boire" },
                 { txt: "it", trad: null } ] } }],
      ["q2", { id: "q2", en: "table", fr: "table", palier: 1,
               indice: { en: "You eat on it", segments: [{ txt: "eat", trad: "manger" }] } }],
      ["q3", { id: "q3", en: "night", fr: "nuit", palier: 1, indice: { en: "", segments: [] } }],
    ]);
    const aVerifier = { ...S.etatInitial(), words: {
      q1: L.ficheAQuizzer("2026-09-08"),
      q2: L.ficheAQuizzer("2026-09-08"),
      q3: L.ficheAQuizzer("2026-09-08"),
    } };

    const passe = QZ.composerQuizz({ state: aVerifier, catalogue: catQuizz, today: "2026-09-08" });
    eq("un mot sans définition n'est pas quizzé", passe.questions.length, 2);
    eq("il est mis de côté pour promotion", passe.sansDefinition.map((m) => m.id), ["q3"]);
    vrai("l'énoncé est la définition, segments compris",
         passe.questions[0].segments.length > 0);
    vrai("le QCM propose plusieurs options", passe.questions[0].options.length > 1);

    const juste = QZ.appliquerQuizz(aVerifier, "q1", true, "2026-09-08");
    eq("quizz réussi → boîte 3", juste.words.q1.b, 3);
    eq("quizz réussi → statut connu", juste.words.q1.st, "connu");
    eq("il entre alors dans le vivier des jeux", L.motsConnus(juste), ["q1"]);

    const rateQuizz = QZ.appliquerQuizz(aVerifier, "q2", false, "2026-09-08");
    eq("quizz raté → boîte 1", rateQuizz.words.q2.b, 1);
    eq("quizz raté → retour en attente", rateQuizz.words.q2.st, "attente");
    eq("et revu deux jours plus tard", rateQuizz.words.q2.r, "2026-09-10");
    eq("il n'entre pas dans les jeux", L.motsConnus(rateQuizz), []);

    const promus = QZ.promouvoirSansDefinition(aVerifier, passe.sansDefinition, "2026-09-08");
    eq("faute de définition, le mot est promu sans être quizzé", promus.words.q3.st, "connu");

    section("le délai de deux jours est tenu (§02 → §03)");

    eq("le jour du tri, rien n'est encore à apprendre",
       L.motsAApprendre(triInconnu, "2026-09-08").length, 0);
    eq("le lendemain non plus",
       L.motsAApprendre(triInconnu, "2026-09-09").length, 0);
    eq("le surlendemain, le mot arrive dans Apprendre",
       L.motsAApprendre(triInconnu, "2026-09-10").map((e) => e.id), ["m2"]);
    eq("la prochaine échéance est annoncée à l'utilisateur",
       L.prochaineEcheanceApprentissage(triInconnu, "2026-09-08"), "2026-09-10");

    section("learnBuilder — QUIZ puis écriture (§03)");

    const aTravailler = { ...triInconnu, words: { ...triInconnu.words,
      m2: { ...triInconnu.words.m2, r: "2026-09-10" } } };
    const lecon = APP.composerApprentissage({ state: aTravailler, catalogue: catDec,
                                              today: "2026-09-10" });
    eq("un exercice est composé par mot dû", lecon.exercices.length, 1);
    vrai("il porte un QUIZ", Boolean(lecon.exercices[0].quiz.options.length));
    vrai("et un exercice d'écriture", Boolean(lecon.exercices[0].ecriture.expected));

    const reussi = APP.appliquerApprentissage(aTravailler, "m2",
      { quizCorrect: true, ecritureCorrecte: true }, "2026-09-10");
    eq("les deux réussis → le mot monte d'une boîte", reussi.words.m2.b, 2);

    const rateEcriture = APP.appliquerApprentissage(aTravailler, "m2",
      { quizCorrect: true, ecritureCorrecte: false }, "2026-09-10");
    eq("l'écriture ratée renvoie en boîte 1", rateEcriture.words.m2.b, 1);
    eq("et le mot est revu deux jours plus tard", rateEcriture.words.m2.r, "2026-09-12");

    const enBoite2 = { words: { m3: { b: 2, r: "2026-09-10", s: 1, e: 0, d: null, st: "actif" } } };
    const promu = APP.appliquerApprentissage(enBoite2, "m3",
      { quizCorrect: true, ecritureCorrecte: true }, "2026-09-10");
    eq("atteindre la boîte 3 renvoie AU QUIZZ, pas aux jeux", promu.words.m3.st, "quizz");
    eq("il est à vérifier le jour même", promu.words.m3.r, "2026-09-10");
    eq("il n'est donc pas encore dans le vivier", L.motsConnus(promu), []);

    section("storyBuilder — couverture et choix du texte (§06)");

    const H1 = { id: "h_001", arc: "a", ordre: 1, lexique: ["m1", "m2"], texte_en: "x" };
    const H2 = { id: "h_002", arc: "a", ordre: 2, lexique: ["m1", "m2", "m3"], texte_en: "x" };
    const toutConnu = { progression: S.etatInitial().progression,
      words: { m1: L.ficheConnue("2026-09-08"), m2: L.ficheConnue("2026-09-08") } };

    eq("la couverture est la part du lexique déjà connue",
       HIS.couverture(H1, new Set(L.motsConnus(toutConnu))), 1);
    eq("un mot du texte non connu fait baisser la couverture",
       Math.round(HIS.couverture(H2, new Set(L.motsConnus(toutConnu))) * 100), 67);

    const choix = HIS.choisirHistoire({ state: toutConnu, histoires: [H2, H1],
                                        today: "2026-09-08" });
    eq("l'histoire la mieux couverte est retenue", choix.histoire.id, "h_001");
    eq("et elle est déclarée suffisante au-delà de 95%", choix.suffisante, true);

    const apresLecture = HIS.appliquerHistoire({ state: toutConnu, histoire: H1,
      appliquer: L.appliquerResultat, today: "2026-09-08" });
    eq("lire fait monter les mots du lexique",
       [apresLecture.words.m1.b, apresLecture.words.m2.b], [4, 4]);
    eq("l'histoire est mémorisée comme lue",
       apresLecture.progression.histoires_lues, ["h_001"]);
    eq("une seule histoire par jour",
       HIS.choisirHistoire({ state: apresLecture, histoires: [H1, H2],
                             today: "2026-09-08" }).dejaLue, true);

    const avecAideLecture = HIS.appliquerHistoire({ state: toutConnu, histoire: H1,
      aides: ["m1"], appliquer: L.appliquerResultat, today: "2026-09-08" });
    eq("un mot dont la traduction a été lue ne monte pas (§5)",
       avecAideLecture.words.m1.b, 3);

    section("store — schéma v4 (§6.6)");

    eq("la version du schéma est 4", S.VERSION, 4);
    eq("l'état initial porte parties_servies",
       S.etatInitial().progression.parties_servies, { grille: [], croises: [] });
    eq("l'état initial porte histoires_lues", S.etatInitial().progression.histoires_lues, []);
    vrai("le défi quotidien a disparu de l'état",
        S.etatInitial().progression.defis_faits === undefined
        && S.etatInitial().progression.streak === undefined);
    eq("nom de sauvegarde imposé par la §7",
       S.nomFichierSauvegarde("2026-09-05"), "wordcode-backup-2026-09-05.json");

    section("store — migration v3 → v4");

    const v3 = { v: 3, words: { z: { b: 4, r: "2026-01-01", s: 3, e: 0, d: null, st: "actif" } },
                 progression: { palier_actuel: 3, streak: 7, defis_faits: ["2026-01-01"],
                                parties_jouees: ["p_g1"] } };
    const v4 = S.migrer(v3);
    eq("la migration amène en version 4", v4.v, 4);
    eq("le statut est réaligné sur la boîte", v4.words.z.st, "connu");
    vrai("les champs du défi sont retirés",
        v4.progression.streak === undefined && v4.progression.defis_faits === undefined);
    eq("les parties déjà jouées sont reversées côté grille",
       v4.progression.parties_servies.grille, ["p_g1"]);
    eq("et rien n'est reversé côté mots croisés",
       v4.progression.parties_servies.croises, []);
    eq("la progression réelle est conservée", v4.progression.palier_actuel, 3);

    /* ============================ secours API des histoires (§16) ========= */
    section("api.js — génération d'une histoire (§16)");

    const lexique40 = Array.from({ length: 40 }, (_, i) => `mot${i}`);
    const texte300 = Array.from({ length: 300 }, () => "word").join(" ");

    const serveurHistoire = (charge, statut = 200) => async () => ({
      ok: statut >= 200 && statut < 300,
      status: statut,
      json: async () => charge,
    });

    eq("moins de 40 mots connus → on n'appelle même pas",
       (await A.genererHistoire({ mots: ["a", "b"] })).cause, A.CAUSES.LEXIQUE_TROP_MAIGRE);
    eq("hors ligne → refus net",
       (await A.genererHistoire({ mots: lexique40, enLigne: false })).cause,
       A.CAUSES.HORS_LIGNE);

    const trop = await A.genererHistoire({
      mots: lexique40, enLigne: true,
      recuperer: serveurHistoire({ texte_en: "trop court" }),
    });
    eq("un texte hors des bornes 250-350 est refusé", trop.cause, A.CAUSES.REPONSE);

    const bonne = await A.genererHistoire({
      mots: lexique40, enLigne: true,
      recuperer: serveurHistoire({ titre_en: "T", texte_en: texte300, texte_fr: "F" }),
    });
    vrai("un texte dans les bornes est accepté", bonne.ok);
    eq("le nombre de mots est recompté côté client", bonne.donnees.nb_mots, 300);

    eq("un 502 est signalé comme service indisponible",
       (await A.genererHistoire({ mots: lexique40, enLigne: true,
                                  recuperer: serveurHistoire({}, 502) })).cause,
       A.CAUSES.INDISPONIBLE);

    section("storyBuilder — requête et relecture de la réponse (§16)");

    const catHist = new Map([
      ["h1", { id: "h1", en: "door", fr: "porte" }],
      ["h2", { id: "h2", en: "room", fr: "pièce" }],
    ]);
    const etatHist = { progression: { histoires_lues: [] },
      words: { h1: L.ficheConnue("2026-09-08"), h2: L.ficheConnue("2026-09-08") } };

    const requete = HIS.requeteHistoire({ state: etatHist, catalogue: catHist, histoires: [] });
    eq("la requête n'envoie que des mots réellement connus",
       requete.mots.sort(), ["door", "room"]);
    eq("sans arc en cours, aucune continuation n'est demandée", requete.arc, null);

    const relue = HIS.histoireDepuisApi(
      { titre_en: "T", texte_en: "The door of the room was open.", texte_fr: "F" },
      { catalogue: catHist, id: "h_api_2026-09-08" });
    eq("le lexique est RECALCULÉ depuis le texte, pas lu dans la réponse",
       relue.lexique.sort(), ["h1", "h2"]);
    vrai("les mots hors catalogue sont listés à part",
         relue.hors_lexique.includes("open"));
    eq("l'origine est tracée", relue.source, "api");
    eq("l'identifiant est daté", HIS.idHistoireGeneree("2026-09-08"), "h_api_2026-09-08");

    eq("une réponse sans texte ne produit rien",
       HIS.histoireDepuisApi({ texte_en: "  " }, { catalogue: catHist, id: "x" }), null);

    /* ================================ §08 Écrire ========================== */
    section("writingBuilder — dictée et traduction (§08)");

    const phrasesEcr = [
      { id: "d_1", en: "The dog is on the chair.", fr: ["Le chien est sur la chaise."],
        audio: "audio/1.mp3", lecteur: "CK", en_alt: [] },
      { id: "d_2", en: "I have a dream.", fr: ["J'ai un rêve."],
        audio: "audio/2.mp3", lecteur: "CK", en_alt: ["I've got a dream."] },
    ];
    const premiere = (liste) => liste[0];

    const dictee = ECR.composerEcriture({ state: S.etatInitial(), phrases: phrasesEcr,
                                          mode: "dictee", tirer: premiere });
    eq("en dictée, aucun énoncé écrit n'est fourni", dictee.exercice.invite, null);
    eq("la réponse attendue est la phrase prononcée",
       dictee.exercice.attendu, "The dog is on the chair.");

    const trad = ECR.composerEcriture({ state: S.etatInitial(), phrases: phrasesEcr,
                                        mode: "traduction", tirer: premiere });
    eq("en traduction, l'énoncé est le français",
       trad.exercice.invite, "Le chien est sur la chaise.");

    eq("sans phrase livrée, la section est verrouillée",
       ECR.composerEcriture({ state: S.etatInitial(), phrases: [] }).verrouille, true);

    section("writingBuilder — correction d'une réponse");

    vrai("la casse et la ponctuation ne comptent pas (§17.4)",
         ECR.verifierEcriture("the dog is on the chair", dictee.exercice).correct);
    eq("une réponse exacte est signalée comme telle",
       ECR.verifierEcriture("The dog is on the chair.", dictee.exercice).exact, true);
    faux("une réponse fausse est refusée",
         ECR.verifierEcriture("the cat is on the table", dictee.exercice).correct);
    faux("une réponse vide est refusée",
         ECR.verifierEcriture("   ", dictee.exercice).correct);

    const avecAlt = ECR.composerEcriture({ state: S.etatInitial(), phrases: [phrasesEcr[1]],
                                           mode: "traduction", tirer: premiere });
    const variante = ECR.verifierEcriture("I've got a dream.", avecAlt.exercice);
    vrai("une formulation alternative du corpus est acceptée", variante.correct);
    faux("mais elle n'est pas déclarée exacte", variante.exact);

    section("writingBuilder — effet sur les boîtes (§4.1)");

    const catEcr = new Map([
      ["w1", { id: "w1", en: "dog", fr: "chien", type: "n" }],
      ["w2", { id: "w2", en: "chair", fr: "chaise", type: "n" }],
    ]);
    const connuEcr = { ...S.etatInitial(),
      words: { w1: L.ficheConnue("2026-09-10"), w2: L.ficheConnue("2026-09-10") } };

    const reussie = ECR.appliquerEcriture({ state: connuEcr, exercice: dictee.exercice,
                                            correct: true, catalogue: catEcr, today: "2026-09-10" });
    eq("écrire la phrase fait monter les mots connus qu'elle contient",
       [reussie.words.w1.b, reussie.words.w2.b], [4, 4]);
    eq("la phrase est retenue comme faite", reussie.progression.dictees_faites, ["d_1"]);

    const ratee = ECR.appliquerEcriture({ state: connuEcr, exercice: dictee.exercice,
                                          correct: false, catalogue: catEcr, today: "2026-09-10" });
    eq("un échec ne fait redescendre aucun mot",
       [ratee.words.w1.b, ratee.words.w2.b], [3, 3]);
    eq("mais la phrase est quand même consommée", ratee.progression.dictees_faites, ["d_1"]);

    eq("une phrase déjà faite n'est pas reproposée tant qu'il en reste",
       ECR.composerEcriture({ state: reussie, phrases: phrasesEcr,
                              mode: "dictee", tirer: premiere }).exercice.phrase.id, "d_2");
    vrai("stock épuisé → le cycle repart",
         ECR.composerEcriture({
           state: { ...reussie, progression: { ...reussie.progression, dictees_faites: ["d_1", "d_2"] } },
           phrases: phrasesEcr, mode: "dictee", tirer: premiere }).reinitialise);

    section("writingBuilder — rédaction libre (§08)");

    const maigre = ECR.composerRedaction({ state: connuEcr, catalogue: catEcr });
    eq("moins de 30 mots validés → rédaction verrouillée", maigre.verrouille, true);

    const noms = ["alpha", "bravo", "charly", "delta", "echo", "foxtrot", "golf",
                  "hotel", "india", "juliet", "kilo", "lima", "mike", "november",
                  "oscar", "papa", "quebec", "romeo", "sierra", "tango", "uniform",
                  "victor", "whisky", "xray", "yankee", "zulu", "anton", "berta",
                  "casar", "dora", "emil", "fritz", "gustav", "heinz", "ida",
                  "julius", "konrad", "ludwig", "martha", "nordpol"];
    const richeMots = new Map();
    const richeState = { ...S.etatInitial(), words: {} };
    noms.forEach((nom, i) => {
      richeMots.set(`r${i}`, { id: `r${i}`, en: nom, fr: `mot${i}`, type: "n" });
      richeState.words[`r${i}`] = L.ficheConnue("2026-09-10");
    });
    const sujet = ECR.composerRedaction({ state: richeState, catalogue: richeMots, tirer: premiere });
    faux("avec assez de mots, la rédaction s'ouvre", sujet.verrouille);
    eq("cinq mots sont imposés", sujet.mots.length, ECR.MOTS_IMPOSES);
    vrai("les mots imposés sont tous connus",
         sujet.mots.every((m) => L.motsConnus(richeState).includes(m.id)));
    vrai("une consigne est fournie", Boolean(sujet.consigne?.fr));

    // Les mots de test n'ont AUCUN chiffre : la vérification retire les
    // caractères non alphabétiques, « word0 » deviendrait « word ».
    const bilanRed = ECR.verifierRedaction("I like alpha and bravo very much.", sujet.mots);
    eq("les mots employés sont reconnus", bilanRed.employes.sort(), ["alpha", "bravo"]);
    eq("les autres sont listés comme manquants", bilanRed.manquants.length, 3);
    eq("le nombre de mots est compté", bilanRed.nbMots, 7);

    section("api.js — correction d'une rédaction (§16)");

    const serveurRed = (charge, statut = 200) => async () => ({
      ok: statut >= 200 && statut < 300, status: statut, json: async () => charge,
    });

    eq("un texte vide n'appelle pas le service",
       (await A.corrigerRedaction({ texte: "  " })).cause, A.CAUSES.VIDE);
    eq("hors ligne → refus net",
       (await A.corrigerRedaction({ texte: "Hello world.", enLigne: false })).cause,
       A.CAUSES.HORS_LIGNE);

    const corrigee = await A.corrigerRedaction({
      texte: "I go to school yesterday.", enLigne: true,
      recuperer: serveurRed({ corrige: "I went to school yesterday.",
                              remarques: [{ ecrit: "go", correct: "went", pourquoi: "passé" }],
                              reussi: "La phrase est claire." }),
    });
    vrai("une correction bien formée est acceptée", corrigee.ok);
    eq("le texte corrigé revient", corrigee.donnees.corrige, "I went to school yesterday.");

    eq("une réponse sans correction est refusée",
       (await A.corrigerRedaction({ texte: "Hello.", enLigne: true,
                                    recuperer: serveurRed({ remarques: [] }) })).cause,
       A.CAUSES.REPONSE);
    eq("un 502 est signalé comme service indisponible",
       (await A.corrigerRedaction({ texte: "Hello.", enLigne: true,
                                    recuperer: serveurRed({}, 502) })).cause,
       A.CAUSES.INDISPONIBLE);

    /* ============================ reconnaissance vocale (§17) ============= */
    section("speech.js — dicter au lieu d'écrire");

    /** Faux moteur : on pilote résultat et erreur à la main. */
    const moteurFactice = (comportement) => function () {
      return {
        lang: "", interimResults: false, maxAlternatives: 1, continuous: false,
        start() { setTimeout(() => comportement(this), 1); },
        stop() {},
      };
    };
    const ecoutePar = (comportement) =>
      VOX.ecouter({ Moteur: moteurFactice(comportement) }).promesse;

    const ditQuelqueChose = await ecoutePar(
      (r) => r.onresult({ results: [[{ transcript: "  My car is old.  " }]] }));
    vrai("une transcription non vide est un succès", ditQuelqueChose.ok);
    eq("le texte est nettoyé de ses espaces", ditQuelqueChose.texte, "My car is old.");

    eq("micro refusé → cause explicite",
       (await ecoutePar((r) => r.onerror({ error: "not-allowed" }))).cause, VOX.CAUSES.REFUSE);
    eq("rien entendu → silence",
       (await ecoutePar((r) => r.onend())).cause, VOX.CAUSES.SILENCE);
    eq("transcription vide → silence aussi",
       (await ecoutePar((r) => r.onresult({ results: [[{ transcript: "   " }]] }))).cause,
       VOX.CAUSES.SILENCE);
    eq("réseau absent → cause réseau",
       (await ecoutePar((r) => r.onerror({ error: "network" }))).cause, VOX.CAUSES.RESEAU);
    eq("navigateur sans moteur → indisponible",
       (await VOX.ecouter({ Moteur: null }).promesse).cause, VOX.CAUSES.INDISPONIBLE);

    vrai("chaque cause a un message lisible",
         Object.values(VOX.CAUSES).every((c) => typeof VOX.message(c) === "string"
                                             && VOX.message(c).length > 10));
    eq("un code inconnu retombe sur une erreur générique",
       VOX.causePourErreur("chose-inconnue"), VOX.CAUSES.ERREUR);

    section("verbes irréguliers — contenu livré (§3.2)");

    const filiereVerbes = await C.chargerVerbes({ manifeste: { verbes: "verbes.json" } });
    faux("la filière verbes est bien livrée", filiereVerbes.absente);
    vrai("elle passe la validation sans anomalie", filiereVerbes.erreurs.length === 0);
    vrai("elle contient de quoi travailler", filiereVerbes.verbes.length >= 40);
    vrai("chaque verbe a ses trois formes",
         filiereVerbes.verbes.every((v) => v.en && v.preterit && v.participe));
    vrai("chaque verbe porte un groupe de pattern valide",
         filiereVerbes.verbes.every((v) => [1, 2, 3, 4].includes(v.groupe_verbe)));
    vrai("les quatre groupes sont représentés",
         [1, 2, 3, 4].every((g) => filiereVerbes.verbes.some((v) => v.groupe_verbe === g)));
    vrai("aucun verbe n'est éligible aux grilles (§3.2)",
         filiereVerbes.verbes.every((v) => !v.eligible_grille && !v.eligible_croises));

    /* ==================================================== conclusion ====== */
    const sum = document.getElementById("sum");
    const bilan = document.createElement("span");
    bilan.className = ko === 0 ? "t__ok" : "t__ko";
    bilan.textContent = ko === 0
      ? `${ok} tests, tous verts${attentes ? ` · ${attentes} en attente de contenu` : ""}`
      : `${ko} échecs sur ${ok + ko}`;
    sum.append(bilan);
    document.title = `${ko === 0 ? "OK" : "ÉCHEC"} — ${ok + ko} tests WordCode`;
  </script>
</body>
</html>
